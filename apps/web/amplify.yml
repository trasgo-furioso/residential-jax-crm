version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g pnpm
            - cd $CODEBUILD_SRC_DIR && pnpm install --frozen-lockfile
        build:
          commands:
            - cd $CODEBUILD_SRC_DIR && NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL pnpm turbo run build --filter=web...
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - $CODEBUILD_SRC_DIR/node_modules/**/*
          - .next/cache/**/*
