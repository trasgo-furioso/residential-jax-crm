version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm
        - cd ../.. && pnpm install --frozen-lockfile
    build:
      commands:
        - cd ../.. && pnpm turbo run build --filter=@crm/web...
    postBuild:
      commands:
        - rm -rf .amplify
        - mkdir -p .amplify/compute/default
        - mkdir -p .amplify/static/_next
        - cp -R .next/standalone/. .amplify/compute/default/
        - cp -R .next/static .amplify/static/_next/
        - if [ -d public ]; then cp -R public .amplify/compute/default/; fi
        - node -e "require('fs').writeFileSync('.amplify/deploy-manifest.json', JSON.stringify({version:1,routes:[{path:'/_next/static/*',target:{kind:'Static',src:'static'}},{path:'/*',target:{kind:'Compute',src:'default'}}],computeResources:[{name:'default',entrypoint:'server.js'}]}))"
        - test -f .amplify/compute/default/server.js
        - test -f .amplify/deploy-manifest.json
  artifacts:
    baseDirectory: .amplify
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
