version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm turbo run build --filter=@crm/web...
    postBuild:
      commands:
        - rm -rf apps/web/.amplify
        - mkdir -p apps/web/.amplify/compute/default
        - mkdir -p apps/web/.amplify/static/_next
        - ls -la apps/web/.next/standalone/ || true
        - ls -la apps/web/.next/standalone/apps/web/ || true
        - 'if [ -f apps/web/.next/standalone/apps/web/server.js ]; then echo "Monorepo standalone layout detected"; cp -R apps/web/.next/standalone/. apps/web/.amplify/compute/default/; else echo "Flat standalone layout"; cp -R apps/web/.next/standalone/. apps/web/.amplify/compute/default/; fi'
        - cp -R apps/web/.next/static apps/web/.amplify/static/_next/
        - if [ -d apps/web/public ]; then cp -R apps/web/public apps/web/.amplify/compute/default/; fi
        - node -e "require('fs').writeFileSync('apps/web/.amplify/deploy-manifest.json',JSON.stringify({version:1,routes:[{path:'/_next/static/*',target:{kind:'Static',src:'static'}},{path:'/*',target:{kind:'Compute',src:'default'}}],computeResources:[{name:'default',entrypoint:'server.js'}]}))"
        - 'find apps/web/.amplify/compute/default -name "server.js" -type f | head -5'
        - 'if [ -f apps/web/.amplify/compute/default/server.js ]; then echo "server.js at root"; elif [ -f apps/web/.amplify/compute/default/apps/web/server.js ]; then echo "server.js nested - moving to root"; cp -R apps/web/.amplify/compute/default/apps/web/. apps/web/.amplify/compute/default/_nested/ && rm -rf apps/web/.amplify/compute/default/apps && mv apps/web/.amplify/compute/default/_nested/* apps/web/.amplify/compute/default/ && rm -rf apps/web/.amplify/compute/default/_nested; fi'
        - test -f apps/web/.amplify/compute/default/server.js
        - test -f apps/web/.amplify/deploy-manifest.json
  artifacts:
    baseDirectory: apps/web/.amplify
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - apps/web/node_modules/**/*
      - apps/web/.next/cache/**/*
      - .turbo/**/*
