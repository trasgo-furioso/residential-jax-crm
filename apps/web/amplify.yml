version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm install -g pnpm
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm turbo run build --filter=@crm/web...
        postBuild:
          commands:
            - rm -rf apps/web/.amplify
            - mkdir -p apps/web/.amplify/compute/default
            - mkdir -p apps/web/.amplify/static/_next
            - cp -R apps/web/.next/standalone/. apps/web/.amplify/compute/default/
            - cp -R apps/web/.next/static apps/web/.amplify/static/_next/
            - if [ -d apps/web/public ]; then cp -R apps/web/public apps/web/.amplify/compute/default/; fi
            - node -e "require('fs').writeFileSync('apps/web/.amplify/deploy-manifest.json',JSON.stringify({version:1,routes:[{path:'/_next/static/*',target:{kind:'Static',src:'static'}},{path:'/*',target:{kind:'Compute',src:'default'}}],computeResources:[{name:'default',entrypoint:'server.js'}]}))"
            - test -f apps/web/.amplify/compute/default/server.js
            - test -f apps/web/.amplify/deploy-manifest.json
      artifacts:
        baseDirectory: apps/web/.amplify
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - apps/web/node_modules/**/*
          - apps/web/.next/cache/**/*
          - .turbo/**/*
